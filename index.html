<style>
/* Layout: the card's front as a header, a 2-column grid of 6 action tiles, then contact details */
:root{
  --ground:#f3f0ea; --paper:#ffffff; --line:#e3dccd; --charcoal:#1c1b1f;
  --gold:#ab8c52; --gold-deep:#8a6e3e; --gold-wash:#f7f2e8; --muted:#77736b;
  --serif:"Tinos","Times New Roman",Times,serif;
  --mark:"Cinzel","Trajan Pro","Times New Roman",serif;
  --sans:"Arimo",Arial,Helvetica,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--ground); color:var(--charcoal); font-family:var(--sans);
  -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
  min-height:100vh; display:flex; justify-content:center; align-items:center;
  padding-block:max(32px, env(safe-area-inset-top,0px)) max(32px, env(safe-area-inset-bottom,0px));
  padding-left:max(20px, env(safe-area-inset-left,0px)); padding-right:max(20px, env(safe-area-inset-right,0px));
}
main{width:100%;max-width:400px;display:flex;flex-direction:column;align-items:center;text-align:center}

/* Header */
header{display:flex;flex-direction:column;align-items:center}
.logo{width:64px;height:auto;display:block}
.word{font-family:var(--mark);font-weight:600;font-size:22px;letter-spacing:.24em;margin:11px 0 0 .24em;line-height:1}
.sub{font-family:var(--mark);font-size:10.5px;letter-spacing:.36em;color:var(--gold);margin:7px 0 0 .36em}
.rule{width:44px;height:2px;background:var(--gold);border:0;margin:22px 0 18px}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(34px,10.5vw,42px);line-height:1.05;margin:0;text-wrap:balance}
.role{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold-deep);margin:11px 0 0 .3em}
.practice{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px 12px;margin:14px 0 0;
  font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--charcoal)}
.practice i{width:1px;height:12px;background:var(--gold);display:block}

/* Tiles */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;margin-top:30px}
.tile{
  aspect-ratio:5/4; max-width:100%; min-width:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:11px;
  background:var(--paper); border:1px solid var(--line); color:var(--charcoal);
  text-decoration:none; position:relative; padding:10px;
  transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
}
.tile svg{width:32px;height:32px;flex:none}
.tile span{font-size:11px;font-weight:500;letter-spacing:.2em;text-transform:uppercase}
.tile small{display:block;font-size:10px;letter-spacing:.08em;color:var(--muted);margin-top:-5px;text-transform:none}
.tile::after{content:"";position:absolute;right:9px;top:9px;width:9px;height:9px;
  border-top:1.5px solid var(--gold);border-right:1.5px solid var(--gold);opacity:.7}
.tile.primary{background:var(--charcoal);border-color:var(--charcoal);color:var(--paper)}
.tile.feature{background:var(--gold-wash);border-color:var(--gold)}
.tile.feature small{color:var(--gold-deep)}
.tile .gold{color:var(--gold-deep)}
.tile:active{transform:scale(.97)}
@media (hover:hover){
  .tile:hover{transform:translateY(-2px);box-shadow:0 14px 28px -16px rgba(40,32,18,.45);border-color:var(--gold)}
}
.tile:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

/* Footer */
.details{margin-top:28px;display:grid;gap:5px;font-size:13.5px;color:var(--muted)}
.details a{color:inherit;text-decoration:none}

/* Entrance */
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
header,.tile,.details{animation:rise .6s cubic-bezier(.2,.7,.2,1) both}
.tile:nth-child(1){animation-delay:.10s}.tile:nth-child(2){animation-delay:.15s}
.tile:nth-child(3){animation-delay:.20s}.tile:nth-child(4){animation-delay:.25s}
.tile:nth-child(5){animation-delay:.30s}.tile:nth-child(6){animation-delay:.35s}
.details{animation-delay:.42s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
