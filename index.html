<style>
/* Layout: the card's front as a header, then a 2x2 grid of square action tiles */
:root{
  --ground:#f3f0ea; --paper:#ffffff; --line:#e3dccd; --charcoal:#1c1b1f;
  --gold:#ab8c52; --gold-deep:#8a6e3e; --muted:#77736b;
  --serif:"Tinos","Times New Roman",Times,serif;
  --mark:"Cinzel","Trajan Pro","Times New Roman",serif;
  --sans:"Arimo",Arial,Helvetica,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--ground); color:var(--charcoal); font-family:var(--sans);
  -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
  min-height:100%; display:flex; justify-content:center; align-items:center;
  padding-block:max(28px, env(safe-area-inset-top,0px)) max(28px, env(safe-area-inset-bottom,0px));
  padding-left:max(20px, env(safe-area-inset-left,0px)); padding-right:max(20px, env(safe-area-inset-right,0px));
}
main{width:100%;max-width:400px;display:flex;flex-direction:column;align-items:center;text-align:center}

/* Header */
.logo{width:72px;height:auto;display:block}
.word{font-family:var(--mark);font-weight:600;font-size:24px;letter-spacing:.24em;margin:12px 0 0 .24em;line-height:1}
.sub{font-family:var(--mark);font-size:11px;letter-spacing:.36em;color:var(--gold);margin:7px 0 0 .36em}
.rule{width:48px;height:2px;background:var(--gold);border:0;margin:26px 0 20px}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(34px,10.5vw,44px);line-height:1.05;margin:0;text-wrap:balance}
.role{font-size:11.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold-deep);margin:12px 0 0 .3em}

/* 2x2 tiles */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;margin-top:36px}
.tile{
  aspect-ratio:1/1; max-width:100%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  background:var(--paper); border:1px solid var(--line); color:var(--charcoal);
  text-decoration:none; position:relative;
  transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
}
.tile svg{width:38px;height:38px;flex:none}
.tile span{font-size:11.5px;font-weight:500;letter-spacing:.2em;text-transform:uppercase}
.tile::after{ /* gold corner tick, echoes the stair mark */
  content:"";position:absolute;right:10px;top:10px;width:10px;height:10px;
  border-top:1.5px solid var(--gold);border-right:1.5px solid var(--gold);opacity:.7
}
.tile.primary{background:var(--charcoal);border-color:var(--charcoal);color:var(--paper)}
.tile.primary span{color:var(--paper)}
.tile .gold{color:var(--gold-deep)}
.tile:active{transform:scale(.97)}
@media (hover:hover){
  .tile:hover{transform:translateY(-2px);box-shadow:0 14px 28px -16px rgba(40,32,18,.45);border-color:var(--gold)}
}
.tile:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

/* Footer */
.details{margin-top:30px;display:grid;gap:5px;font-size:14px;color:var(--muted)}
.details a{color:inherit;text-decoration:none}
.details .web{color:var(--gold-deep);letter-spacing:.02em}

/* Entrance */
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
header,.tile,.details{animation:rise .6s cubic-bezier(.2,.7,.2,1) both}
.tile:nth-child(1){animation-delay:.12s}.tile:nth-child(2){animation-delay:.18s}
.tile:nth-child(3){animation-delay:.24s}.tile:nth-child(4){animation-delay:.30s}
.details{animation-delay:.38s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
header{display:flex;flex-direction:column;align-items:center}
</style>
